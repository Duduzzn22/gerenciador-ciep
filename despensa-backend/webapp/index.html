     tela inicial do celular (sem barra de endereço nem aparência de site) -->

<style>
  :root{
    --bg:#F4F6F5;
    --surface:#FFFFFF;
    --surface-2:#EDF1EF;
    --ink:#1F2A28;
    --muted:#5B6B67;
    --line:#DCE3E1;
    --accent:#1F6F5C;
    --accent-ink:#0F3E33;
    --accent-soft:#E4F0EC;
    --warn:#A8660F;
    --warn-soft:#FBEDD8;
    --crit:#B3392C;
    --crit-soft:#FBE4E1;
    --shadow: 0 1px 2px rgba(20,30,28,0.06), 0 4px 14px rgba(20,30,28,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121716; --surface:#1B2422; --surface-2:#212B29; --ink:#E9EEEC; --muted:#9BAAA6;
      --line:#2B3634; --accent:#4FBF9E; --accent-ink:#DFF6EE; --accent-soft:#1E3530;
      --warn:#E0A542; --warn-soft:#3A2C15; --crit:#E2695C; --crit-soft:#3A211D;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#121716; --surface:#1B2422; --surface-2:#212B29; --ink:#E9EEEC; --muted:#9BAAA6;
    --line:#2B3634; --accent:#4FBF9E; --accent-ink:#DFF6EE; --accent-soft:#1E3530;
    --warn:#E0A542; --warn-soft:#3A2C15; --crit:#E2695C; --crit-soft:#3A211D;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 20px rgba(0,0,0,0.35);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Public Sans', system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; font-variant-numeric: tabular-nums; }
  #root{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:84px; position:relative; }
  .label{ font-family:'Barlow Condensed', system-ui, sans-serif; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
  .topbar{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 16px 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand-name{ font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:700; font-size:22px; line-height:1; color:var(--accent-ink); }
  .brand-sub{ font-size:12px; color:var(--muted); }
  .who-chip{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; }
  .who-chip svg{ width:14px; height:14px; stroke:var(--muted); flex:none; }
  .content{ flex:1; padding:14px 16px 8px; display:flex; flex-direction:column; gap:14px; }
  .section-title{ font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600; font-size:18px; letter-spacing:0.01em; color:var(--ink); }
  .pending-banner{ background:var(--accent-soft); color:var(--accent-ink); border:1px solid var(--accent); border-radius:0; padding:9px 16px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .pending-banner::before{ content:''; width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; animation: pulse 1.2s ease-in-out infinite; }
  .alert-banner{ padding:9px 16px; font-size:13px; font-weight:700; text-align:left; cursor:pointer; font-family:inherit; border-width:1px 0 1px 4px; border-style:solid; width:100%; }
  .alert-banner.critico{ border-color:var(--crit); background:var(--crit-soft); color:var(--crit); }
  .alert-banner.baixo{ border-color:var(--warn); background:var(--warn-soft); color:var(--warn); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .search-row{ display:flex; gap:8px; }
  .search-input{ flex:1; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:10px 12px; font-size:15px; color:var(--ink); font-family:inherit; }
  .search-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .chip.low[aria-pressed="true"]{ background:var(--warn); border-color:var(--warn); color:#1B1200; }
  .cat-group{ display:flex; flex-direction:column; gap:10px; }
  .cat-header{ font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600; font-size:15px; color:var(--accent-ink); text-transform:uppercase; letter-spacing:0.04em; padding-bottom:6px; border-bottom:2px solid var(--accent-soft); }
  .cat-count{ color:var(--muted); font-weight:500; text-transform:none; letter-spacing:normal; }
  .item-list{ display:flex; flex-direction:column; gap:10px; }
  .item-card{ background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:12px; padding:12px 13px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; }
  .item-card[data-status="baixo"]{ border-left-color:var(--warn); }
  .item-card[data-status="critico"]{ border-left-color:var(--crit); }
  .item-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .item-name{ font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600; font-size:17px; }
  .item-qty{ text-align:right; flex:none; }
  .item-qty b{ font-size:19px; font-weight:700; }
  .item-qty span{ font-size:12px; color:var(--muted); display:block; }
  .status-tag{ display:inline-block; font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; text-transform:uppercase; letter-spacing:0.03em; }
  .status-tag.ok{ background:var(--accent-soft); color:var(--accent-ink); }
  .status-tag.baixo{ background:var(--warn-soft); color:var(--warn); }
  .status-tag.critico{ background:var(--crit-soft); color:var(--crit); }
  .item-actions{ display:flex; gap:8px; }
  .qtybtn{ flex:1; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:8px; padding:8px 0; font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .qtybtn:disabled{ opacity:.5; }
  .qtybtn.entrada{ color:var(--accent); }
  .qtybtn.saida{ color:var(--crit); }
  .qtybtn svg{ width:16px; height:16px; stroke:currentColor; }
  .empty-note{ color:var(--muted); font-size:14px; padding:20px 4px; text-align:center; }
  .form{ display:flex; flex-direction:column; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; }
  .field-hint{ font-size:11px; color:var(--muted); }
  select, input[type="text"], input[type="number"], input[type="email"], input[type="password"]{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit; width:100%; }
  select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  select:disabled, input:disabled{ opacity:.6; }
  .qty-row{ display:flex; align-items:center; gap:8px; }
  .stepper{ width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font-size:20px; font-weight:700; color:var(--ink); flex:none; cursor:pointer; }
  .stepper:disabled{ opacity:.5; }
  .btn{ border:none; border-radius:12px; padding:13px 16px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary[data-kind="saida"]{ background:var(--crit); }
  .btn-primary:disabled{ opacity:0.5; }
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn-ghost:disabled{ opacity:.5; }
  .picked-item{ display:flex; align-items:center; justify-content:space-between; background:var(--surface-2); border-radius:10px; padding:10px 12px; font-size:14px; }
  .picked-item b{ font-family:'Barlow Condensed'; font-weight:600; font-size:16px; }
  .day-group{ display:flex; flex-direction:column; gap:8px; }
  .day-header{ font-family:'Barlow Condensed', system-ui, sans-serif; font-weight:600; font-size:14px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .hist-list{ display:flex; flex-direction:column; gap:8px; }
  .hist-time{ font-size:12px; font-weight:700; color:var(--muted); width:40px; flex:none; text-align:center; font-variant-numeric:tabular-nums; line-height:1.15; }
  .hist-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .hist-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none; }
  .hist-icon.entrada{ background:var(--accent-soft); }
  .hist-icon.saida{ background:var(--crit-soft); }
  .hist-icon svg{ width:16px; height:16px; }
  .hist-icon.entrada svg{ stroke:var(--accent-ink); }
  .hist-icon.saida svg{ stroke:var(--crit); }
  .hist-main{ flex:1; min-width:0; }
  .hist-title{ font-size:14px; font-weight:600; }
  .hist-title.is-undone{ text-decoration:line-through; color:var(--muted); }
  .hist-sub{ font-size:12px; color:var(--muted); }
  .hist-side{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none; }
  .hist-qty{ font-weight:700; font-size:15px; flex:none; }
  .hist-qty.saida{ color:var(--crit); }
  .hist-qty.entrada{ color:var(--accent-ink); }
  .undo-tag{ display:inline-block; margin-left:5px; border-radius:6px; padding:1px 5px; background:var(--warn-soft); color:var(--warn); font-size:10px; font-weight:700; text-decoration:none; vertical-align:middle; text-transform:uppercase; }
  .undo-btn{ min-height:28px; border:1px solid var(--line); background:var(--surface-2); color:var(--muted); border-radius:7px; padding:4px 8px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; }
  .undo-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .overlay{ position:fixed; inset:0; background:rgba(15,25,22,0.45); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  .modal{ background:var(--surface); border-radius:16px 16px 0 0; padding:18px 16px 24px; width:100%; max-width:520px; display:flex; flex-direction:column; gap:12px; max-height:88vh; overflow-y:auto; }
  .modal-title{ font-family:'Barlow Condensed'; font-weight:700; font-size:20px; }
  .profile-list{ display:flex; flex-direction:column; gap:8px; }
  .cad-row{ display:flex; align-items:center; justify-content:space-between; width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:10px; padding:12px 14px; font-size:15px; font-weight:600; text-align:left; }
  .categoria-row small{ color:var(--muted); font-size:12px; font-weight:600; }
  .categoria-row .undo-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .grupo-row{ padding-top:2px; }
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); display:flex; justify-content:center; padding-bottom:env(safe-area-inset-bottom); }
  .tabbar-inner{ max-width:520px; width:100%; display:flex; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; padding:8px 2px 7px; background:none; border:none; color:var(--muted); cursor:pointer; }
  .tab svg{ width:20px; height:20px; stroke:var(--muted); }
  .tab span{ font-size:10px; font-weight:600; white-space:nowrap; }
  .tab[aria-current="true"]{ color:var(--accent); }
  .tab[aria-current="true"] svg{ stroke:var(--accent); }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:60; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; max-width:90%; text-align:center; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .auth-box{ width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .auth-title{ font-family:'Barlow Condensed'; font-weight:700; font-size:26px; color:var(--accent-ink); text-align:center; }
  .auth-sub{ font-size:13px; color:var(--muted); text-align:center; margin-top:-8px; }
  .auth-tabs{ display:flex; gap:6px; background:var(--surface-2); border-radius:10px; padding:4px; }
  .auth-tab{ flex:1; border:none; background:none; padding:9px 0; border-radius:8px; font-size:13px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit; }
  .auth-tab[aria-pressed="true"]{ background:var(--surface); color:var(--accent-ink); box-shadow:var(--shadow); }
  .auth-error{ background:var(--crit-soft); color:var(--crit); border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; }
  .auth-info{ background:var(--accent-soft); color:var(--accent-ink); border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; }
  .loading-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }
  @media print{ .topbar,.tabbar,.toast,.alert-banner,.pending-banner,.search-row,.chip-row,.item-actions,.btn{ display:none !important; } #root{ max-width:none; padding:0; } .content{ padding:0; } body{ background:#fff; color:#000; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* Telas maiores (computador/tablet deitado): a tela continua igual no
     celular, só aproveita melhor o espaço extra — mais itens lado a lado,
     e os formulários ficam com uma largura confortável de leitura em vez
     de esticar a linha inteira. */
  @media (min-width: 860px){
    #root{ max-width:1040px; }
    .tabbar-inner{ max-width:1040px; }
    .item-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; }
    .form{ max-width:480px; }
    .auth-box{ max-width:420px; }
  }
</style>

};
var UNITS = ['kg','L','un','pacote','cx','garrafa'];
var REASONS_SAIDA = ['Preparo de refeição','Vencimento/Descarte','Perda ou quebra','Outro motivo'];

function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtQty(n){ var v = Math.round(n*100)/100; return v.toLocaleString('pt-BR', {maximumFractionDigits:2}); }
function round2(n){ return Math.round(n*100)/100; }
function normalizar(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function statusOf(item){ if(item.qty <= 0) return 'critico'; if(item.qty <= item.min) return 'baixo'; return 'ok'; }
function statusLabel(s){ return s==='critico' ? 'Em falta' : (s==='baixo' ? 'Estoque baixo' : 'Estoque ok'); }
function areaLabel(a){ return a==='ambas' ? 'Cozinha e Limpeza' : (a==='limpeza' ? 'Limpeza' : 'Cozinha'); }
function fmtDateTime(iso){ var d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); }
function fmtWeekdayDate(iso){
  var d = new Date(iso);
  var wd = d.toLocaleDateString('pt-BR', {weekday:'long'});
  wd = wd.charAt(0).toUpperCase() + wd.slice(1);
  return wd + ' · ' + d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function dayKey(iso){ var d = new Date(iso); function pad(n){ return n<10 ? '0'+n : ''+n; } return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function monthKey(iso){ var d = new Date(iso); function pad(n){ return n<10 ? '0'+n : ''+n; } return d.getFullYear() + '-' + pad(d.getMonth()+1); }
var NOMES_MES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function categoriasEstado(state){ return (state && state.categorias) || []; }
function nomeCategoria(c){ return (c && typeof c === 'object') ? c.nome : c; }
function catOrderIndex(state, cat){
  var cats = categoriasEstado(state);
  for(var i=0;i<cats.length;i++){ if(nomeCategoria(cats[i])===cat) return i; }
  return 9999;
}
function areaDaCategoria(state, nomeCat){
  var cats = categoriasEstado(state);
  for(var i=0;i<cats.length;i++){ if(nomeCategoria(cats[i])===nomeCat) return cats[i].area || 'cozinha'; }
  return 'cozinha';
}
function categoriaVisivel(state, cat, ui){
  var area = areaAtual(state, ui);
  if(area==='todos') return true;
  return areaDaCategoria(state, cat) === area;
}

/* ---------------------------------------------------------------------
   CSV — igual ao app anterior, só que lendo do novo formato de estado.
--------------------------------------------------------------------- */
function csvCell(v){ var s = String(v==null?'':v); if(/[";\n]/.test(s)){ s = '"' + s.replace(/"/g,'""') + '"'; } return s; }
function rowsToCsv(rows){ return rows.map(function(r){ return r.map(csvCell).join(';'); }).join('\r\n'); }
function buildEstoqueCsv(state){
  var rows = [['Nome','Categoria','Área','Unidade','Quantidade atual','Estoque mínimo','Situação','Cadastrado por']];
  state.items.slice().sort(function(a,b){
    var ca = catOrderIndex(state, a.cat), cb = catOrderIndex(state, b.cat);
    if(ca!==cb) return ca-cb;
    return a.name.localeCompare(b.name,'pt-BR');
  }).forEach(function(it){
    rows.push([it.name, it.cat, areaLabel(areaDaCategoria(state, it.cat)), it.unit, fmtQty(it.qty), fmtQty(it.min), statusLabel(statusOf(it)), it.criadoPor||'']);
  });
  return rowsToCsv(rows);
}
function buildChecklistContagemCsv(state){
  var rows = [['Categoria','Área','Item','Unidade','Estoque no sistema','Contagem real (preencher)','Diferença (preencher)']];
  state.items.slice().sort(function(a,b){
    var ca = catOrderIndex(state, a.cat), cb = catOrderIndex(state, b.cat);
    if(ca!==cb) return ca-cb;
    return a.name.localeCompare(b.name,'pt-BR');
  }).forEach(function(it){ rows.push([it.cat, areaLabel(areaDaCategoria(state, it.cat)), it.name, it.unit, fmtQty(it.qty), '', '']); });
  return rowsToCsv(rows);
}
function buildListaCompras(state){
  var itens = state.items.filter(function(it){ return statusOf(it)!=='ok'; }).sort(function(a,b){
    var ca = catOrderIndex(state, a.cat), cb = catOrderIndex(state, b.cat);
    if(ca!==cb) return ca-cb;
    return a.name.localeCompare(b.name,'pt-BR');
  });
  var linhas = ['Lista de compras - Despensa Digital (' + (state.schoolName || 'Cozinha da escola') + ')', 'Gerada em ' + fmtDateTime(new Date().toISOString()), ''];
  if(!itens.length){ linhas.push('Nenhum item com estoque baixo ou em falta.'); return linhas.join('\n'); }
  var agrupar = itens.length > 5, catAtual = '';
  itens.forEach(function(it){
    if(agrupar && it.cat!==catAtual){ catAtual = it.cat; if(linhas[linhas.length-1] !== '') linhas.push(''); linhas.push(catAtual); }
    var comprar = Math.max(1, round2((parseFloat(it.min)||0) - (parseFloat(it.qty)||0)));
    linhas.push('- ' + it.name + ' - comprar ~' + fmtQty(comprar) + ' ' + it.unit + ' (estoque atual: ' + fmtQty(it.qty) + ' ' + it.unit + ', mínimo: ' + fmtQty(it.min) + ' ' + it.unit + ')');
  });
  return linhas.join('\n');
}
function buildMovimentacoesCsv(state, movsOverride){
  var movs = movsOverride || state.movements;
  var rows = [['Data','Horário','Dia da semana','Mês','Item','Tipo','Quantidade','Unidade','Quem registrou','Fornecedor','Motivo','Observação','Estornada','Estornada por','Estornada em']];
  movs.slice().sort(function(a,b){ return new Date(a.at) - new Date(b.at); }).forEach(function(m){
    var it = state.items.filter(function(i){ return i.id===m.itemId; })[0];
    var d = new Date(m.at);
    rows.push([
      d.toLocaleDateString('pt-BR'), fmtTime(m.at), d.toLocaleDateString('pt-BR', {weekday:'long'}), NOMES_MES[d.getMonth()] + ' de ' + d.getFullYear(),
      it?it.name:'Item removido', m.type==='entrada'?'Entrada':'Saída',
      fmtQty(m.qty), m.unidade || (it?it.unit:''), m.who||'', m.fornecedor||'', m.motivo||'', m.nota||'',
      m.estornado ? 'Sim' : 'Não', m.estornadoPor || '', m.estornadoEm ? fmtDateTime(m.estornadoEm) : ''
    ]);
  });
  return rowsToCsv(rows);
}
function salvarDownloadBrowser(filename, content){
  var BOM = String.fromCharCode(0xFEFF);
  var blob = new Blob([BOM + content], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ---------------------------------------------------------------------
   ARQUIVAMENTO — helpers de data (a decisão de apagar de verdade é do
   banco, via RPC arquivar_movimentos_antigos; aqui só calculamos o que
   SERIA arquivado, para mostrar o aviso e gerar o CSV antes de mandar
   apagar).
--------------------------------------------------------------------- */
function mesesAtras(n){ var d = new Date(); d.setMonth(d.getMonth() - n); return d; }
function prazoArquivoMeses(state){ var n = parseInt(state && state.arquivoMeses, 10); return (n && n>0) ? n : 12; }
function movimentacoesParaArquivar(state){
  var corte = mesesAtras(prazoArquivoMeses(state));
  return state.movements.filter(function(m){ return new Date(m.at) < corte; });
}

}

function renderAlertaEstoque(state, ui){
  if(ui.tab==='estoque' && ui.showLowOnly) return '';
  var criticos = 0, baixos = 0;
  state.items.forEach(function(it){ var st = statusOf(it); if(st==='critico') criticos++; else if(st==='baixo') baixos++; });
  if(!criticos && !baixos) return '';
  var partes = [];
  if(criticos) partes.push(criticos + ' item' + (criticos===1?'':'s') + ' em falta');
  if(baixos) partes.push(baixos + ' com estoque baixo');
  return '<button class="alert-banner ' + (criticos?'critico':'baixo') + '" type="button" data-action="ver-baixo-estoque">' + escHtml(partes.join(' · ')) + '</button>';
}
function renderAlertaArquivo(state, ui){
  if(!isAdmin()) return '';
  if(ui.tab==='cadastro' && ui.cadastroSub==='dados') return '';
  var pendentes = movimentacoesParaArquivar(state).length;
  if(!pendentes) return '';
  return '<button class="alert-banner baixo" type="button" data-action="ir-arquivar">' + pendentes + ' movimentação(ões) com mais de ' + prazoArquivoMeses(state) + ' meses prontas para arquivar</button>';

function itemsFiltered(state, ui){
  var q = normalizar((ui.search||'').trim());

    if(!categoriaVisivel(state, it.cat, ui)) return false;
    if(ui.categoryFilter && ui.categoryFilter!=='todas' && it.cat!==ui.categoryFilter) return false;
    if(ui.showLowOnly && statusOf(it)==='ok') return false;
    if(q && normalizar(it.name).indexOf(q)===-1) return false;
    return true;
  }).sort(function(a,b){ return a.name.localeCompare(b.name,'pt-BR'); });

  var list = itemsFiltered(state, ui);

function optionsForSelect(state, ui, selectedId){

  categoriasEstado(state).forEach(function(c){
    var nome = nomeCategoria(c);
    if(!byCat[nome] || !byCat[nome].length) return;
    html += '<optgroup label="' + escHtml(nome) + '">';
    byCat[nome].sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR');}).forEach(function(it){
      html += '<option value="' + it.id + '"' + (it.id===selectedId?' selected':'') + '>' + escHtml(it.name) + ' (' + fmtQty(it.qty) + ' ' + escHtml(it.unit) + ')</option>';

  });

function renderHistorico(state, ui){

  var list = state.movements.slice().sort(function(a,b){ return new Date(b.at) - new Date(a.at); }).filter(function(m){
    if(!q) return true;
    var it = state.items.filter(function(i){return i.id===m.itemId;})[0];
    var name = it? normalizar(it.name) : '';
    return name.indexOf(q)!==-1 || normalizar(m.who||'').indexOf(q)!==-1 || normalizar(m.fornecedor||'').indexOf(q)!==-1 || normalizar(m.motivo||'').indexOf(q)!==-1;
  });
  var byDay = {}, order = [];
  list.forEach(function(m){ var k = dayKey(m.at); if(!byDay[k]){ byDay[k] = { label: fmtWeekdayDate(m.at), rows: [] }; order.push(k); } byDay[k].rows.push(m); });
  var groupsHtml = order.map(function(k){
    var g = byDay[k];
    return '<div class="day-group"><div class="day-header">' + escHtml(g.label) + '</div><div class="hist-list">' + g.rows.map(function(m){ return renderHistRow(m, state, false); }).join('') + '</div></div>';
  }).join('');
  return '' +
  '<div class="section-title">Histórico de movimentações</div>' +
  '<div class="field-hint">Pra desfazer uma entrada ou saída, use o botão "Desfazer" que aparece em "Últimas registradas" nas abas Entrada/Saída (só fica disponível ali, logo depois de registrar).</div>' +

  '<button class="btn btn-ghost" type="button" data-action="gerar-contagem">Gerar lista de contagem</button>' +
  '<button class="btn btn-ghost" type="button" data-action="exportar-planilha">&#8681; Exportar planilha (Excel)</button>';
}
function renderTabBar(state, ui){

  if(ui.modal.type==='confirmar-duplicado'){

      '<div class="modal-title">Já existe um item parecido</div>' +

function renderCadastroUsuarios(state, ui){

    '</div>' +

    '<button class="btn btn-primary" type="button" data-action="arquivar-antigas"' + ((pendentes && !ui.saving)?'':' disabled') + '>Arquivar ' + pendentes + ' movimentação(ões) agora</button>';
}
function renderCadastroResumo(state, ui){
  var criticos = state.items.filter(function(it){ return statusOf(it)==='critico'; });
  var baixos = state.items.filter(function(it){ return statusOf(it)==='baixo'; });
  var recentes = state.movements.slice(0, 8);
  var porPessoa = {};
  state.movements.forEach(function(m){
    var nome = m.who || 'Desconhecido';
    porPessoa[nome] = (porPessoa[nome]||0) + 1;
  });
  var rankingPessoas = Object.keys(porPessoa).map(function(n){ return {nome:n, total:porPessoa[n]}; })
    .sort(function(a,b){ return b.total - a.total; }).slice(0, 8);

  var recentesHtml = recentes.map(function(m){
    var it = state.items.filter(function(i){ return i.id===m.itemId; })[0];
    var isEntrada = m.type==='entrada';
    return '<div class="cad-row categoria-row" style="align-items:flex-start;flex-direction:column;gap:2px">' +
      '<span style="font-size:13px">' + (isEntrada?'Entrada':'Saída') + ' de ' + fmtQty(m.qty) + ' ' + escHtml(m.unidade||'') + ' — ' + escHtml(it?it.name:'Item removido') + (m.estornado?' <span class="undo-tag">Estornada</span>':'') + '</span>' +
      '<small style="color:var(--muted)">' + escHtml(m.who||'') + ', ' + fmtDateTime(m.at) + '</small>' +
    '</div>';
  }).join('');

  var pessoasHtml = rankingPessoas.map(function(p){
    return '<div class="cad-row categoria-row"><span>' + escHtml(p.nome) + '</span><small style="color:var(--muted)">' + p.total + ' ação(ões)</small></div>';
  }).join('');

  return '' +
    '<div class="section-title" style="font-size:15px">Resumo geral</div>' +
    '<div style="font-size:12px;color:var(--muted)">Visão geral do estoque e da atividade recente, pra você acompanhar sem precisar entrar em cada aba.</div>' +
    '<button class="picked-item" type="button" style="width:100%;border:none;cursor:pointer" data-action="ver-baixo-estoque"><span>Itens em falta (zerados)</span><b style="' + (criticos.length?'color:var(--crit)':'') + '">' + criticos.length + '</b></button>' +
    '<button class="picked-item" type="button" style="width:100%;border:none;cursor:pointer" data-action="ver-baixo-estoque"><span>Itens com estoque baixo</span><b style="' + (baixos.length?'color:var(--warn)':'') + '">' + baixos.length + '</b></button>' +
    '<div class="picked-item"><span>Total de produtos cadastrados</span><b>' + state.items.length + '</b></div>' +
    '<div class="picked-item"><span>Pessoas cadastradas</span><b>' + state.profiles.length + '</b></div>' +
    '<div class="section-title" style="font-size:15px;margin-top:14px">Atividade recente</div>' +
    '<div class="profile-list">' + recentesHtml + '</div>' +
    (recentesHtml ? '' : '<div class="empty-note">Nenhuma movimentação registrada ainda.</div>') +
    '<div class="section-title" style="font-size:15px;margin-top:14px">Ações por pessoa</div>' +
    '<div class="profile-list">' + pessoasHtml + '</div>' +
    (pessoasHtml ? '' : '<div class="empty-note">Ninguém registrou entrada/saída ainda.</div>');
}
function renderCadastroAuditoria(state, ui){
  var log = (state.auditLog || []).slice().reverse().slice(0, 100);
  var rows = log.map(function(a){
    var d = new Date(a.em);
    var quando = isNaN(d.getTime()) ? '' : d.toLocaleString('pt-BR');
    return '<div class="cad-row categoria-row" style="align-items:flex-start;flex-direction:column;gap:2px">' +
      '<span style="font-size:13px">' + escHtml(a.descricao) + '</span><small style="color:var(--muted)">' + escHtml(quando) + '</small>' +
    '</div>';
  }).join('');
  return '' +
    '<div class="section-title" style="font-size:15px">Auditoria</div>' +
    '<div style="font-size:12px;color:var(--muted)">Cada linha é gravada com a autoria confirmada pelo login de quem fez a ação (não é possível registrar em nome de outra pessoa).</div>' +
    '<div class="profile-list">' + rows + '</div>' +
    (log.length ? '' : '<div class="empty-note">Nenhuma ação registrada ainda.</div>');
}
function renderCadastro(state, ui){
  var sub = ui.cadastroSub || 'produtos';
  var body = sub==='resumo' ? renderCadastroResumo(state, ui) : (sub==='categorias' ? renderCadastroCategorias(state, ui) : (sub==='usuarios' ? renderCadastroUsuarios(state, ui) : (sub==='dados' ? renderCadastroDados(state, ui) : (sub==='auditoria' ? renderCadastroAuditoria(state, ui) : renderCadastroProdutos(state, ui)))));
  return '<div class="section-title">Cadastro</div>' + renderCadastroSubChips(ui) + body;
}
function renderRoot(state, ui){
  var panel = '';
  var tab = (ui.tab==='cadastro' && !isAdmin()) ? 'estoque' : ui.tab;
  if(tab==='estoque') panel = renderEstoque(state, ui);
  else if(tab==='entrada') panel = renderMovForm(state, ui, 'entrada');
  else if(tab==='saida') panel = renderMovForm(state, ui, 'saida');
  else if(tab==='cadastro') panel = renderCadastro(state, ui);
  else panel = renderHistorico(state, ui);
  return renderTopBar(state, ui) + renderAlertaEstoque(state, ui) + renderAlertaArquivo(state, ui) + renderPendingBanner(ui) +
    '<div class="content">' + panel + '</div>' + renderTabBar(state, ui) + renderModal(state, ui);
}

function mapItem(row, catsById){
  var cat = catsById[row.category_id];
  return { id: row.id, name: row.name, cat: cat ? cat.nome : '', category_id: row.category_id, unit: row.unit, qty: Number(row.qty), min: Number(row.min), criadoPor: row.criado_por, criadoEm: row.criado_em, ajustadoPor: row.ajustado_por, ajustadoEm: row.ajustado_em };
}
function mapMovement(row){
  return { id: row.id, itemId: row.item_id, type: row.type, qty: Number(row.qty), unidade: row.unidade, who: row.who_name, whoId: row.who_id, fornecedor: row.fornecedor, motivo: row.motivo, nota: row.nota, at: row.at, estornado: row.estornado, estornadoPor: row.estornado_por_nome, estornadoEm: row.estornado_em };
}
async function carregarTudo(){
  var catsRes = await sb.from('categories').select('*').order('nome');
  if(catsRes.error) throw catsRes.error;
  var catsById = {};
  catsRes.data.forEach(function(c){ catsById[c.id] = c; });
  state.categorias = catsRes.data;

  var itemsRes = await sb.from('items').select('*');
  if(itemsRes.error) throw itemsRes.error;
  state.items = itemsRes.data.map(function(row){ return mapItem(row, catsById); });

  var movsRes = await sb.from('movements').select('*').order('at', {ascending:false}).limit(2000);
  if(movsRes.error) throw movsRes.error;
  state.movements = movsRes.data.map(mapMovement);

  var settingsRes = await sb.from('settings').select('*').eq('id', true).single();
  if(!settingsRes.error && settingsRes.data){
    state.schoolName = settingsRes.data.school_name;
    state.arquivoMeses = settingsRes.data.arquivo_meses;
    state.ultimaExportacaoEm = settingsRes.data.ultima_exportacao_em;
  }

  var profilesRes = await sb.from('profiles').select('*').order('created_at');
  if(!profilesRes.error){
    state.profiles = profilesRes.data;
    // Ressincroniza o perfil do usuário logado com o que está no banco agora:
    // sem isso, se o próprio papel/área mudar (auto-rebaixamento, ou outro
    // admin editando essa pessoa), a tela continuaria usando a versão antiga
    // (guardada só no login) e mostraria abas/ações que não deveriam mais existir.
    if(auth.session){
      var perfilAtualizado = state.profiles.filter(function(p){ return p.id === auth.session.user.id; })[0];
      if(perfilAtualizado){
        auth.profile = perfilAtualizado;
      } else {
        // A pessoa foi removida (por outro admin, ou removeu a si mesma) enquanto
        // estava com a tela aberta: desconecta e volta pra tela de login.
        desligarRealtime();
        auth.session = null; auth.profile = null; auth.info = 'Seu acesso foi removido por um administrador.';
        throw { message: 'Sua conta foi removida.' };
      }
    }
  }

  if(isAdmin()){
    var auditRes = await sb.from('audit_log').select('*').order('em', {ascending:false}).limit(300);
    if(!auditRes.error){ state.auditLog = auditRes.data; }
    var mapaPlanilhaRes = await sb.from('planilha_merenda_mapa').select('*');
    if(!mapaPlanilhaRes.error){ state.planilhaMapa = mapaPlanilhaRes.data; }
  } else {
    state.auditLog = [];
    state.planilhaMapa = [];
  }
}
function generoPlanilhaDoItem(state, itemId){
  var m = (state.planilhaMapa||[]).filter(function(x){ return x.item_id===itemId; })[0];
  return m ? m.genero_planilha : '';
}

var realtimeChannel = null;
function ligarRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel('despensa-mudancas')
    .on('postgres_changes', {event:'*', schema:'public', table:'items'}, function(){ recarregarSilencioso(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'movements'}, function(){ recarregarSilencioso(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'categories'}, function(){ recarregarSilencioso(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, function(){ recarregarSilencioso(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, function(){ recarregarSilencioso(); })
    .subscribe();
}
function desligarRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}
var recarregarTimer = null;
function recarregarSilencioso(){
  clearTimeout(recarregarTimer);
  recarregarTimer = setTimeout(async function(){
    try{ await carregarTudo(); paint(); }catch(e){}
  }, 400);
}

/* ---------------------------------------------------------------------
   TRADUÇÃO DE ERROS — o banco de dados e a rede às vezes devolvem
   mensagens técnicas em inglês (ex.: violação de política de segurança,
   chave duplicada, falha de rede). Quem está usando o app no dia a dia
   não precisa ver isso: aqui a gente reconhece os formatos técnicos mais
   comuns e troca por uma frase simples em português. Mensagens que o
   PRÓPRIO sistema já escreve em português (vindas das funções do banco,
   como "sem permissão para esta área") não batem em nenhum desses
   padrões em inglês, então passam direto sem alteração.
--------------------------------------------------------------------- */
function traduzErroAcao(msg){
  if(!msg) return 'Não foi possível salvar agora. Tente de novo em instantes.';
  if(/row-level security policy/i.test(msg)) return 'Você não tem permissão para fazer isso.';
  if(/duplicate key value violates unique constraint/i.test(msg)) return 'Já existe um registro com esse nome.';
  if(/violates foreign key constraint/i.test(msg)) return 'Não é possível concluir: ainda existe algo vinculado a isso.';
  if(/violates check constraint|invalid input value for enum/i.test(msg)) return 'Um dos valores informados não é válido.';
  if(/failed to fetch|networkerror|network request failed|load failed|err_internet|err_connection|err_name_not_resolved/i.test(msg)) return 'Sem conexão com a internet agora. Verifique e tente de novo.';
  if(/jwt expired|invalid jwt|refresh_token_not_found|invalid refresh token/i.test(msg)) return 'Sua sessão expirou. Saia e entre de novo.';
  if(/permission denied for|relation .* does not exist|syntax error at or near|column .* does not exist/i.test(msg)) return 'Algo deu errado ao salvar. Tente de novo, e avise o administrador do sistema se continuar acontecendo.';
  return msg;
}

/* ---------------------------------------------------------------------
   AÇÕES QUE MEXEM NO BANCO — cada uma trata erro isoladamente; se falhar
   a pessoa recebe um aviso e pode tentar de novo (não há mais o modelo
   antigo de "publicar o HTML inteiro de novo").
--------------------------------------------------------------------- */
async function executarAcao(fn, msgSucesso, msgErroPadrao){
  ui.saving = true; paint();
  try{
    await fn();
    ui.saving = false;
    if(msgSucesso) toast(msgSucesso);
    await carregarTudo();
    paint();
    return true;
  }catch(err){
    ui.saving = false;
    var msg = (err && err.message) ? traduzErroAcao(err.message) : (msgErroPadrao || 'Não foi possível salvar. Tente de novo.');
    toast(msg);
    paint();
    return false;
  }
}

function onClick(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');

  if(action==='noop') return;

  /* --- tela de login/criar conta --- */
  if(action==='auth-tab'){ auth.screen = el.getAttribute('data-tab'); auth.error=''; auth.info=''; paintAuth(); return; }
  if(action==='fazer-login'){ fazerLogin(); return; }
  if(action==='criar-conta'){ criarConta(); return; }
  if(action==='ir-recuperar'){ auth.screen='recuperar'; auth.error=''; auth.info=''; paintAuth(); return; }
  if(action==='voltar-login'){ auth.screen='entrar'; auth.error=''; auth.info=''; paintAuth(); return; }
  if(action==='enviar-recuperacao'){ fazerRecuperacao(); return; }
  if(action==='salvar-nova-senha'){ salvarNovaSenha(); return; }
  if(action==='sair'){ sair(); return; }
  if(action==='tentar-novamente-inicial'){ window.location.reload(); return; }
  if(action==='abrir-conta'){ ui.modal = {type:'conta'}; paint(); return; }

  if(action==='set-tab'){ ui.formItemId=''; ui.formQty=1; ui.formUnidade=''; ui.formFornecedor=''; ui.formMotivo=REASONS_SAIDA[0]; ui.formNota=''; switchTab(el.getAttribute('data-tab')); return; }
  if(action==='ir-entrada'){ var itX = findItem(el.getAttribute('data-id')); ui.formItemId = el.getAttribute('data-id'); ui.formQty=1; ui.formUnidade = itX?itX.unit:''; ui.formFornecedor=''; ui.formMotivo=REASONS_SAIDA[0]; ui.formNota=''; switchTab('entrada'); return; }
  if(action==='ir-saida'){ var itY = findItem(el.getAttribute('data-id')); ui.formItemId = el.getAttribute('data-id'); ui.formQty=1; ui.formUnidade = itY?itY.unit:''; ui.formFornecedor=''; ui.formMotivo=REASONS_SAIDA[0]; ui.formNota=''; switchTab('saida'); return; }
  if(action==='set-cat'){ ui.categoryFilter = el.getAttribute('data-cat'); paint(); return; }
  if(action==='set-grupo'){ ui.grupoFilter = el.getAttribute('data-grupo') || 'todos'; if(ui.categoryFilter!=='todas' && !categoriaVisivel(state, ui.categoryFilter, ui)) ui.categoryFilter = 'todas'; paint(); return; }
  if(action==='toggle-low'){ ui.showLowOnly = !ui.showLowOnly; paint(); return; }
  if(action==='ver-baixo-estoque'){ ui.showLowOnly = true; ui.categoryFilter = 'todas'; ui.grupoFilter='todos'; switchTab('estoque'); return; }
  if(action==='close-modal'){ ui.modal = null; paint(); return; }
  if(action==='set-cadastro-sub'){ ui.cadastroSub = el.getAttribute('data-sub') || 'produtos'; paint(); return; }
  if(action==='ir-arquivar'){ if(!exigirAdmin()) return; ui.cadastroSub = 'dados'; switchTab('cadastro'); return; }
  if(action==='arquivar-antigas'){ arquivarAntigos(); return; }
  if(action==='salvar-prazo-arquivo'){
    if(!exigirAdmin()) return;
    var novoMeses = parseInt((document.querySelector('[data-field="arquivo-meses"]')||{}).value, 10);
    if(!novoMeses || novoMeses<1){ toast('Informe um número de meses válido (mínimo 1).'); return; }
    executarAcao(async function(){
      var res = await sb.from('settings').update({ arquivo_meses: novoMeses }).eq('id', true);
      if(res.error) throw res.error;
      await registrarAuditoria('config', quemAtual() + ' alterou o prazo de arquivamento para ' + novoMeses + ' meses.');
    }, 'Prazo de arquivamento atualizado!');
    return;
  }
  if(action==='salvar-area-categoria'){
    if(!exigirAdmin()) return;
    var catId = el.getAttribute('data-cat-id');
    var rowEl = el.closest('.cad-row');
    var selEl = rowEl ? rowEl.querySelector('[data-field="cat-area-edit"]') : null;
    var novaAreaCat = selEl ? selEl.value : 'cozinha';
    if(novaAreaCat!=='cozinha' && novaAreaCat!=='limpeza') novaAreaCat = 'cozinha';
    var catAlvo = state.categorias.filter(function(c){ return c.id===catId; })[0];
    executarAcao(async function(){
      var res = await sb.from('categories').update({ area: novaAreaCat }).eq('id', catId);
      if(res.error) throw res.error;
      await registrarAuditoria('categoria', quemAtual() + ' definiu a área de "' + (catAlvo?catAlvo.nome:'') + '" como ' + areaLabel(novaAreaCat) + '.');
    }, 'Área da categoria salva!');
    return;
  }
  if(action==='novo-item'){
    if(!exigirAdmin()) return;
    var catsList = categoriasEstado(state);
    var catInicial = catsList.length ? nomeCategoria(catsList[0]) : '';
    ui.modal = {type:'novo-item', cat:catInicial, unit:UNITS[0], qty:0, min:1};
    paint();
    return;
  }
  if(action==='ajustar-item'){ ui.modal = {type:'ajustar', id:el.getAttribute('data-id')}; paint(); return; }
  if(action==='qty-step'){ var d = parseFloat(el.getAttribute('data-delta')); ui.formQty = round2(Math.max(0, (parseFloat(ui.formQty)||0) + d)); paint(); return; }
  if(action==='adicionar-categoria'){
    if(!exigirAdmin()) return;
    var novaCat = ((document.querySelector('[data-field="cat-nova"]')||{}).value || '').trim();
    var novaArea = ((document.querySelector('[data-field="cat-area"]')||{}).value || 'cozinha');
    if(novaArea!=='cozinha' && novaArea!=='limpeza') novaArea = 'cozinha';
    if(!novaCat){ toast('Digite o nome da categoria.'); return; }
    var existe = state.categorias.filter(function(c){ return normalizar(c.nome)===normalizar(novaCat); })[0];
    if(existe){ toast('Essa categoria já existe.'); return; }
    executarAcao(async function(){
      var res = await sb.from('categories').insert({ nome: novaCat, area: novaArea });
      if(res.error) throw res.error;
      await registrarAuditoria('categoria', quemAtual() + ' criou a categoria "' + novaCat + '" (' + areaLabel(novaArea) + ').');
    }, 'Categoria adicionada!');
    return;
  }
  if(action==='remover-categoria'){
    if(!exigirAdmin()) return;
    var catId2 = el.getAttribute('data-cat-id');
    var catRem = el.getAttribute('data-cat');
    var emUso = state.items.filter(function(it){ return it.cat===catRem; }).length;
    if(emUso){ toast('Só dá para remover categoria sem produto.'); return; }
    executarAcao(async function(){
      var res = await sb.from('categories').delete().eq('id', catId2);
      if(res.error) throw res.error;
      await registrarAuditoria('categoria', quemAtual() + ' removeu a categoria "' + catRem + '".');
    }, 'Categoria removida.');
    if(ui.categoryFilter===catRem) ui.categoryFilter = 'todas';
    return;
  }
  if(action==='editar-perfil'){
    if(!exigirAdmin()) return;
    var pidEdit = el.getAttribute('data-id');
    var alvoEdit = state.profiles.filter(function(p){ return p.id===pidEdit; })[0];
    if(!alvoEdit) return;
    ui.modal = { type:'perfil-editar', id:pidEdit, name:alvoEdit.name, role:alvoEdit.role, area: alvoEdit.role==='padrao' ? alvoEdit.area : 'cozinha' };
    paint();
    return;
  }
  if(action==='remover-perfil'){
    if(!exigirAdmin()) return;
    var pidRem = el.getAttribute('data-id');
    var alvoRem = state.profiles.filter(function(p){ return p.id===pidRem; })[0];
    if(!alvoRem) return;
    if(alvoRem.role==='admin'){
      var totalAdminsRem = state.profiles.filter(function(p){ return p.role==='admin'; }).length;
      if(totalAdminsRem<=1){ toast('Não é possível remover o único administrador.'); return; }
    }
    if(pidRem === auth.session.user.id){ ui.modal = { type:'confirmar-perfil', acao:'remover', id:pidRem, name:alvoRem.name }; paint(); return; }
    registrarAuditoria('perfil', quemAtual() + ' removeu a pessoa "' + alvoRem.name + '".');
    executarRemoverPerfil(pidRem);
    return;
  }
  if(action==='confirmar-remover-proprio'){
    if(!exigirAdmin()) return;
    if(!ui.modal || ui.modal.type!=='confirmar-perfil') return;
    registrarAuditoria('perfil', quemAtual() + ' removeu a própria conta.');
    executarRemoverPerfil(ui.modal.id);
    return;
  }
  if(action==='salvar-edicao-perfil'){
    if(!exigirAdmin()) return;
    var idEdit = el.getAttribute('data-id');
    var peNome = ((document.querySelector('[data-field="pe-nome"]')||{}).value || '').trim();
    if(!peNome){ toast('Digite o nome.'); return; }
    var peRole = ((document.querySelector('[data-field="pe-role"]')||{}).value || 'padrao');
    if(peRole!=='admin' && peRole!=='padrao') peRole = 'padrao';
    var peArea = 'ambas';
    if(peRole==='padrao'){ peArea = ((document.querySelector('[data-field="pe-area"]')||{}).value || 'cozinha'); if(peArea!=='cozinha' && peArea!=='limpeza' && peArea!=='ambas') peArea = 'cozinha'; }
    var alvoEdit2 = state.profiles.filter(function(p){ return p.id===idEdit; })[0];
    if(!alvoEdit2) return;
    if(alvoEdit2.role==='admin' && peRole!=='admin'){
      var totalAdminsEdit = state.profiles.filter(function(p){ return p.role==='admin'; }).length;
      if(totalAdminsEdit<=1){ toast('Precisa existir pelo menos um administrador.'); return; }
    }
    var detalhe = (alvoEdit2.role==='admin' && peRole!=='admin') ? ' (rebaixado de administrador para padrão)' : ((alvoEdit2.role!=='admin' && peRole==='admin') ? ' (promovido a administrador)' : '');
    var dadosEdit = {name:peNome, role:peRole, area:peArea, _detalhe: detalhe};
    var estaSeRebaixando = (idEdit === auth.session.user.id) && alvoEdit2.role==='admin' && peRole!=='admin';
    if(estaSeRebaixando){ ui.modal = { type:'confirmar-perfil', acao:'rebaixar', id:idEdit, name:peNome, dados:dadosEdit }; paint(); return; }
    executarSalvarEdicaoPerfil(idEdit, dadosEdit);
    return;
  }
  if(action==='confirmar-rebaixar-proprio'){
    if(!exigirAdmin()) return;
    if(!ui.modal || ui.modal.type!=='confirmar-perfil') return;
    executarSalvarEdicaoPerfil(ui.modal.id, ui.modal.dados);
    return;
  }
  if(action==='salvar-novo-item'){
    if(!exigirAdmin()) return;
    var name = ((document.querySelector('[data-field="ni-nome"]')||{}).value || '').trim();
    if(!name){ toast('Digite o nome do item.'); return; }
    var catNome = (document.querySelector('[data-field="ni-cat"]')||{}).value || nomeCategoria(categoriasEstado(state)[0]);
    var catObj = state.categorias.filter(function(c){ return c.nome===catNome; })[0];
    if(!catObj){ toast('Categoria inválida.'); return; }
    var unit = (document.querySelector('[data-field="ni-un"]')||{}).value || UNITS[0];
    var qty = round2(parseFloat((document.querySelector('[data-field="ni-qty"]')||{}).value) || 0);
    var min = round2(parseFloat((document.querySelector('[data-field="ni-min"]')||{}).value) || 0);
    var nomeParecido = state.items.filter(function(it){ return it.cat===catNome && normalizar(it.name)===normalizar(name); })[0];
    if(nomeParecido){
      ui.modal = { type:'confirmar-duplicado', nome:name, catNome:catNome, nomeExistente:nomeParecido.name, catObj:catObj, unit:unit, qty:qty, min:min };
      paint();
      return;
    }
    executarSalvarNovoItem(name, catNome, catObj, unit, qty, min);
    return;
  }
  if(action==='confirmar-duplicado-cadastrar'){
    if(!ui.modal || ui.modal.type!=='confirmar-duplicado') return;
    var cd2 = ui.modal;
    executarSalvarNovoItem(cd2.nome, cd2.catNome, cd2.catObj, cd2.unit, cd2.qty, cd2.min);
    return;
  }
  if(action==='salvar-ajuste'){
    var idAj = el.getAttribute('data-id');
    var itAj = findItem(idAj);
    var qty = parseFloat((document.querySelector('[data-field="aj-qty"]')||{}).value);
    var min = parseFloat((document.querySelector('[data-field="aj-min"]')||{}).value);
    var unField = document.querySelector('[data-field="aj-un"]');
    var novaUnidade = (isAdmin() && unField) ? unField.value : null;
    var generoField = document.querySelector('[data-field="aj-genero-planilha"]');
    var novoGenero = generoField ? generoField.value.trim() : null;
    var patch = { ajustado_por: quemAtual(), ajustado_em: new Date().toISOString() };
    if(!isNaN(qty)) patch.qty = round2(Math.max(0,qty));
    if(!isNaN(min)) patch.min = round2(Math.max(0,min));
    if(novaUnidade) patch.unit = novaUnidade;
    var partesAj = [];
    if(itAj && !isNaN(qty) && round2(Math.max(0,qty))!==round2(itAj.qty)) partesAj.push('quantidade de ' + fmtQty(itAj.qty) + ' para ' + fmtQty(round2(Math.max(0,qty))) + ' ' + itAj.unit);
    if(itAj && !isNaN(min) && round2(Math.max(0,min))!==round2(itAj.min)) partesAj.push('mínimo de ' + fmtQty(itAj.min) + ' para ' + fmtQty(round2(Math.max(0,min))) + ' ' + itAj.unit);
    if(itAj && novaUnidade && novaUnidade!==itAj.unit) partesAj.push('unidade de ' + itAj.unit + ' para ' + novaUnidade);
    executarAcao(async function(){
      var res = await sb.from('items').update(patch).eq('id', idAj);
      if(res.error) throw res.error;
      if(partesAj.length && itAj){
        await registrarAuditoria('ajuste', quemAtual() + ' corrigiu "' + itAj.name + '" — ' + partesAj.join('; ') + '.');
      }
      if(generoField){
        if(novoGenero){
          var upMapaRes = await sb.from('planilha_merenda_mapa').upsert({ item_id: idAj, genero_planilha: novoGenero, atualizado_por: quemAtual(), atualizado_em: new Date().toISOString() }, { onConflict: 'item_id' });
          if(upMapaRes.error) throw upMapaRes.error;
        } else {
          var delMapaRes = await sb.from('planilha_merenda_mapa').delete().eq('item_id', idAj);
          if(delMapaRes.error) throw delMapaRes.error;
        }
      }
    }, 'Ajuste salvo!');
    ui.modal = null; paint();
    return;
  }
  if(action==='remover-item'){
    if(!exigirAdmin()) return;
    var idRemIt = el.getAttribute('data-id');
    var itRemIt = findItem(idRemIt);
    executarAcao(async function(){
      var res = await sb.from('items').delete().eq('id', idRemIt);
      if(res.error) throw res.error;
      if(itRemIt) await registrarAuditoria('produto', quemAtual() + ' removeu o produto "' + itRemIt.name + '" (' + itRemIt.cat + ').');
    }, 'Item removido.');
    ui.modal = null; paint();
    return;
  }
  if(action==='estornar-mov'){
    var movId = el.getAttribute('data-id');
    executarAcao(async function(){
      var res = await sb.rpc('estornar_movimento', { p_mov_id: movId });
      if(res.error) throw res.error;
    }, 'Movimentação desfeita!');
    return;
  }
  if(action==='exportar-planilha'){ exportarPlanilha(); return; }
  if(action==='gerar-contagem'){ gerarListaContagem(); return; }
  if(action==='compartilhar-compras'){ compartilharListaCompras(); return; }
  if(action==='confirmar-mov'){
    var kind = el.getAttribute('data-kind2');
    var itemId = ui.formItemId;
    var item = findItem(itemId);
    if(!item){ toast('Selecione um item.'); return; }
    var qtyMov = parseFloat(ui.formQty);
    if(!qtyMov || qtyMov<=0){ toast('Informe uma quantidade maior que zero.'); return; }
    var unidade = item.unit;
    var fornecedor = (ui.formFornecedor||'').trim();
    if(kind==='entrada' && !fornecedor){ toast('Informe o fornecedor para registrar a entrada.'); return; }
    executarAcao(async function(){
      var res = await sb.rpc('registrar_movimento', {
        p_item_id: itemId, p_tipo: kind, p_qty: qtyMov, p_unidade: unidade,
        p_fornecedor: kind==='entrada' ? fornecedor : '', p_motivo: kind==='saida' ? ui.formMotivo : '', p_nota: ui.formNota || ''
      });
      if(res.error) throw res.error;
    }, kind==='entrada' ? 'Entrada registrada!' : 'Saída registrada!');
    ui.formItemId=''; ui.formQty=1; ui.formUnidade=''; ui.formFornecedor=''; ui.formMotivo=REASONS_SAIDA[0]; ui.formNota='';
    return;
  }
}

function onInput(e){
  var el = e.target;
  var field = el.getAttribute && el.getAttribute('data-field');
  if(!field) return;
  if(field==='search'){ ui.search = el.value; paintBuscaDebounced('[data-field="search"]', el.selectionStart); return; }
  if(field==='hist-search'){ ui.histSearch = el.value; paintBuscaDebounced('[data-field="hist-search"]', el.selectionStart); return; }
  if(field==='user-search'){ ui.userSearch = el.value; paintBuscaDebounced('[data-field="user-search"]', el.selectionStart); return; }
  if(field==='form-item'){ ui.formItemId = el.value; ui.formQty=1; ui.formFornecedor=''; ui.formMotivo=REASONS_SAIDA[0]; ui.formNota=''; var picked = findItem(el.value); ui.formUnidade = picked ? picked.unit : ''; paint(); return; }
  if(field==='form-qty'){ ui.formQty = el.value; return; }
  if(field==='form-fornecedor'){ ui.formFornecedor = el.value; return; }
  if(field==='form-motivo'){ ui.formMotivo = el.value; return; }
  if(field==='form-nota'){ ui.formNota = el.value; return; }
  if(field==='ni-nome' && ui.modal){ ui.modal.name = el.value; return; }
  if(field==='ni-cat' && ui.modal){ ui.modal.cat = el.value; return; }
  if(field==='ni-un' && ui.modal){ ui.modal.unit = el.value; return; }
  if(field==='ni-qty' && ui.modal){ ui.modal.qty = el.value; return; }
  if(field==='ni-min' && ui.modal){ ui.modal.min = el.value; return; }
  if(field==='pe-nome' && ui.modal){ ui.modal.name = el.value; return; }
  if(field==='pe-role' && ui.modal){ ui.modal.role = el.value; paint(); return; }
  if(field==='pe-area' && ui.modal){ ui.modal.area = el.value; return; }
  if(field==='auth-email'){ auth.formEmail = el.value; return; }
  if(field==='auth-senha'){ auth.formSenha = el.value; return; }
  if(field==='auth-senha2'){ auth.formSenha2 = el.value; return; }
  if(field==='auth-nome'){ auth.formNome = el.value; return; }
  if(field==='auth-area'){ auth.formArea = el.value; return; }
  if(field==='auth-senha-nova'){ auth.formSenhaNova = el.value; return; }
  if(field==='auth-senha-nova2'){ auth.formSenhaNova2 = el.value; return; }
}

/* ---------------------------------------------------------------------
   AUTENTICAÇÃO
--------------------------------------------------------------------- */
function traduzErroAuth(msg){
  if(!msg) return 'Não foi possível concluir. Tente de novo.';
  if(/Invalid login credentials/i.test(msg)) return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar (veja o link que te enviamos).';
  if(/User already registered/i.test(msg)) return 'Já existe uma conta com esse e-mail. Tente entrar em vez de criar conta.';
  if(/Password should be at least/i.test(msg)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/Unable to validate email address/i.test(msg)) return 'Digite um e-mail válido.';
  return msg;
}
async function fazerLogin(){
  auth.error=''; auth.info='';
  var email = (auth.formEmail||'').trim();
  var senha = auth.formSenha||'';
  if(!email || !senha){ auth.error = 'Preencha e-mail e senha.'; paintAuth(); return; }
  auth.loading = true; paintAuth();
  var res = await sb.auth.signInWithPassword({ email: email, password: senha });
  auth.loading = false;
  if(res.error){ auth.error = traduzErroAuth(res.error.message); paintAuth(); return; }
  await entrarComSessao(res.data.session);
}
async function criarConta(){
  auth.error=''; auth.info='';
  var nome = (auth.formNome||'').trim();
  var email = (auth.formEmail||'').trim();
  var senha = auth.formSenha||'';
  var senha2 = auth.formSenha2||'';
  if(!nome){ auth.error = 'Digite seu nome.'; paintAuth(); return; }
  if(!email){ auth.error = 'Digite seu e-mail.'; paintAuth(); return; }
  if(senha.length < 6){ auth.error = 'A senha precisa ter pelo menos 6 caracteres.'; paintAuth(); return; }
  if(senha !== senha2){ auth.error = 'As senhas não são iguais.'; paintAuth(); return; }
  auth.loading = true; paintAuth();
  var res = await sb.auth.signUp({ email: email, password: senha, options: { data: { name: nome, area: auth.formArea } } });
  auth.loading = false;
  if(res.error){ auth.error = traduzErroAuth(res.error.message); paintAuth(); return; }
  if(res.data && res.data.session){
    await entrarComSessao(res.data.session);
  } else {
    auth.screen = 'entrar';
    auth.info = 'Conta criada! Verifique seu e-mail e clique no link de confirmação, depois volte aqui e entre.';
    auth.formSenha=''; auth.formSenha2='';
    paintAuth();
  }
}
async function fazerRecuperacao(){
  auth.error=''; auth.info='';
  var email = (auth.formEmail||'').trim();
  if(!email){ auth.error = 'Digite seu e-mail.'; paintAuth(); return; }
  auth.loading = true; paintAuth();
  await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  auth.loading = false;
  auth.screen = 'entrar';
  auth.info = 'Se esse e-mail estiver cadastrado, enviamos um link para redefinir a senha. Verifique sua caixa de entrada.';
  paintAuth();
}
async function salvarNovaSenha(){
  auth.error='';
  var senha = auth.formSenhaNova||''; var senha2 = auth.formSenhaNova2||'';
  if(senha.length < 6){ auth.error = 'A senha precisa ter pelo menos 6 caracteres.'; paintAuth(); return; }
  if(senha !== senha2){ auth.error = 'As senhas não são iguais.'; paintAuth(); return; }
  auth.loading = true; paintAuth();
  var res = await sb.auth.updateUser({ password: senha });
  auth.loading = false;
  if(res.error){ auth.error = traduzErroAuth(res.error.message); paintAuth(); return; }
  auth.formSenhaNova=''; auth.formSenhaNova2='';
  toast('Senha alterada com sucesso!');
  vindoDeRecuperacaoSenha = false;
  await entrarComSessao((res.data && res.data.session) || auth.session);
}
async function sair(){
  desligarRealtime();
  await sb.auth.signOut();
  auth.session = null; auth.profile = null; ui.modal = null;
  auth.formEmail=''; auth.formSenha=''; auth.formNome=''; auth.formSenha2=''; auth.formSenhaNova=''; auth.formSenhaNova2=''; auth.screen='entrar'; auth.info=''; auth.error='';
  paintAuth();
}
async function entrarComSessao(session){
  auth.session = session;
  auth.profile = await carregarPerfil(session.user.id);
  if(!auth.profile){
    auth.error = 'Sua conta existe mas o perfil não foi encontrado. Fale com um administrador.';
    auth.session = null;
    paintAuth();
    return;
  }
  try{
    await carregarTudo();
  }catch(e){
    toast('Entrou, mas não consegui carregar os dados agora. Puxe a tela para atualizar.');
  }
  ligarRealtime();
  paint();
}

/* ---------------------------------------------------------------------
   INICIALIZAÇÃO
--------------------------------------------------------------------- */
async function mount(){
  var root = document.getElementById('root');
  root.addEventListener('click', onClick);
  root.addEventListener('input', onInput);

  sb.auth.onAuthStateChange(function(event, session){
    if(event === 'SIGNED_OUT'){
      auth.session = null; auth.profile = null;
      paintAuth();
    }
    if(event === 'PASSWORD_RECOVERY'){
      vindoDeRecuperacaoSenha = false;
      auth.session = session; auth.screen = 'nova-senha'; auth.error=''; auth.info='';
      auth.loading = false;
      paintAuth();
    }
  });

  try{
    var sessRes = await comTimeout(sb.auth.getSession(), 15000);
    var session = sessRes && sessRes.data ? sessRes.data.session : null;
    if(session && vindoDeRecuperacaoSenha){
      vindoDeRecuperacaoSenha = false;
      auth.session = session; auth.screen = 'nova-senha'; auth.error=''; auth.info='';
      auth.loading = false;
      paintAuth();
    } else if(session){
      await comTimeout(entrarComSessao(session), 20000);
    } else {
      auth.loading = false;
      paintAuth();
    }
  }catch(e){
    paintErroInicial();
  }
}
// Faz uma promessa "desistir" depois de ms milissegundos, pra tela inicial
// nunca ficar travada em "Carregando..." pra sempre se a internet cair ou o
// Supabase demorar demais pra responder.
function comTimeout(promise, ms){
  return new Promise(function(resolve, reject){
    var jaResolveu = false;
    var timer = setTimeout(function(){
      if(jaResolveu) return;
      jaResolveu = true;
      reject(new Error('tempo esgotado'));
    }, ms);
    promise.then(function(v){
      if(jaResolveu) return;
      jaResolveu = true;
      clearTimeout(timer);
      resolve(v);
    }, function(err){
      if(jaResolveu) return;
      jaResolveu = true;
      clearTimeout(timer);
      reject(err);
    });
  });
}
function paintErroInicial(){
  document.getElementById('root').innerHTML =
    '<div class="auth-wrap"><div class="auth-box">' +
      '<div class="auth-title">Não foi possível carregar</div>' +
      '<div class="auth-sub">A conexão demorou demais ou falhou. Verifique sua internet e tente de novo.</div>' +
      '<button class="btn btn-primary" type="button" data-action="tentar-novamente-inicial">Tentar novamente</button>' +
    '</div></div>';
}

if(!window.__DESPENSA_SKIP_AUTOMOUNT__){
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', mount); }
  else { mount(); }
}
